<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The License Plate Game</title>

    <!-- Mobile Responsiveness & Web App Capable Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plate Game" />
    <meta name="application-name" content="The License Plate Game" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Collect them all — a fast, touch-friendly, offline-first license plate game for road trips." />

    <!-- Favicon and App Icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Base Stylesheet -->
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <!-- Elmish Application Mount Root -->
    <div id="elmish-app"></div>

    <noscript>
      <div class="noscript-banner">
        <h2>JavaScript Required</h2>
        <p>The License Plate Game requires JavaScript to be enabled in order to run.</p>
      </div>
    </noscript>

    <!-- Client Module Entrypoint -->
    <script type="module" src="/src/Client/App.fs.js"></script>
  </body>
</html>
