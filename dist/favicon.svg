<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073642" />
      <stop offset="100%" stop-color="#002b36" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2aa198" />
      <stop offset="100%" stop-color="#268bd2" />
    </linearGradient>
  </defs>
  <!-- License plate base with rounded corners and border -->
  <rect x="3" y="10" width="58" height="44" rx="8" fill="url(#plateGrad)" stroke="#2aa198" stroke-width="2" />
  <!-- Embossed plate bolt holes -->
  <circle cx="10" cy="17" r="2.5" fill="#586e75" stroke="#657b83" stroke-width="0.5" />
  <circle cx="54" cy="17" r="2.5" fill="#586e75" stroke="#657b83" stroke-width="0.5" />
  <circle cx="10" cy="47" r="2.5" fill="#586e75" stroke="#657b83" stroke-width="0.5" />
  <circle cx="54" cy="47" r="2.5" fill="#586e75" stroke="#657b83" stroke-width="0.5" />
  <!-- Plate state header banner -->
  <rect x="18" y="14" width="28" height="6" rx="3" fill="url(#accentGrad)" />
  <!-- License Plate Digits / Letters: USA -->
  <text x="32" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#eee8d5" text-anchor="middle" letter-spacing="1">USA</text>
  <!-- Mini sticker in corner -->
  <rect x="46" y="42" width="6" height="5" rx="1" fill="#b58900" />
</svg>
